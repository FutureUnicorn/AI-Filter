name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: CI / Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Enable the pinned package manager
        run: corepack enable
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  typecheck:
    name: CI / Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Enable the pinned package manager
        run: corepack enable
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check every workspace
        run: pnpm typecheck

  unit:
    name: CI / Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Set up the pinned uv version
        uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          enable-cache: true
      - name: Enable the pinned package manager
        run: corepack enable
      - name: Run deterministic unit tests
        run: pnpm test:unit

  integration:
    name: CI / Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Enable the pinned package manager
        run: corepack enable
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Run cross-workspace integration tests
        run: pnpm test:integration

  architecture:
    name: CI / Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Enable the pinned package manager
        run: corepack enable
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Enforce repository boundaries
        run: pnpm check:architecture

  build:
    name: CI / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Enable the pinned package manager
        run: corepack enable
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Build applications and packages
        run: pnpm build

  ci-required:
    name: CI / Required
    if: always()
    needs:
      - lint
      - typecheck
      - unit
      - integration
      - architecture
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality job to succeed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          for result in \
            "$LINT_RESULT" \
            "$TYPECHECK_RESULT" \
            "$UNIT_RESULT" \
            "$INTEGRATION_RESULT" \
            "$ARCHITECTURE_RESULT" \
            "$BUILD_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required CI job finished with result: $result"
              exit 1
            fi
          done
