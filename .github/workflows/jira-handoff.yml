name: Jira Handoff

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request_target:
    branches: [develop, main, "feature/**"]
    types: [opened, edited, ready_for_review, reopened, synchronize, converted_to_draft]

concurrency:
  group: jira-handoff-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: write

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Jira Handoff / Trusted Verification
    if: github.event_name == 'pull_request_target' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out protected default-branch verifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Run trusted verifier regression tests
        run: node --test scripts/ci/tests/jira-handoff.test.mjs
      - name: Verify current-head Jira handoff
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_SERVICE_ACCOUNT_ID: ${{ secrets.JIRA_SERVICE_ACCOUNT_ID }}
        run: node scripts/ci/verify-jira-handoff.mjs
