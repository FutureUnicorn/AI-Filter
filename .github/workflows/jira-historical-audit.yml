name: Historical GitHub-Jira Audit

on:
  workflow_dispatch:

concurrency:
  group: historical-github-jira-audit
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: Jira Historical Audit / Read Only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out protected default-branch implementation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Run historical-audit regression tests
        run: node --test scripts/ci/tests/historical-delivery-audit.test.mjs
      - name: Build read-only historical audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: node scripts/ci/audit-historical-delivery.mjs
      - name: Upload historical audit evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: historical-github-jira-audit-${{ github.run_id }}
          path: |
            historical-delivery-audit.json
            historical-delivery-audit.md
          if-no-files-found: error
          retention-days: 30