name: Jira Post-Merge Evidence

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: jira-post-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  sync:
    name: Jira Delivery / Verified Merge Evidence
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'develop' ||
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out protected default-branch implementation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Run post-merge regression tests
        run: node --test scripts/ci/tests/jira-post-merge.test.mjs
      - name: Upsert verified Jira delivery evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_SERVICE_ACCOUNT_ID: ${{ secrets.JIRA_SERVICE_ACCOUNT_ID }}
        run: node scripts/ci/sync-jira-delivery-comment.mjs
