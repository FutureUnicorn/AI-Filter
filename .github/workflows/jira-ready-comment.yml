name: Prepare Jira Ready Comment

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to prepare for human review
        required: true
        type: string

concurrency:
  group: jira-ready-comment-${{ inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Jira Ready Comment / Trusted Upsert
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out protected default-branch implementation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Run ready-comment regression tests
        run: node --test scripts/ci/tests/jira-ready-comment.test.mjs
      - name: Create or update bot-owned Jira ready comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_SERVICE_ACCOUNT_ID: ${{ secrets.JIRA_SERVICE_ACCOUNT_ID }}
        run: node scripts/ci/prepare-jira-ready-comment.mjs
