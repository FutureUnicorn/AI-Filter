name: Production Gate

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# AF-95: the group is deliberately a constant, not keyed on head_sha. Two
# pushes to main produce two different SHAs, so a SHA-keyed group puts them in
# two different groups and serialises nothing -- both deploys could run at once
# against the same signal-audit-production Compose project, the same persistent
# volume, and the same database, replaying migrations concurrently. A single
# self-hosted production runner happens to prevent that today, but that is an
# infrastructure fact this repository does not control and would lose the moment
# a second production runner is added for capacity. A constant group states the
# guarantee here instead of inheriting it. cancel-in-progress stays false so a
# queued revision waits for the in-flight deployment rather than killing it
# part-way through a migration.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  eligibility:
    name: Production / Eligible
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact revision that passed CI
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify production eligibility for the tested revision
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if [ -z "$TESTED_SHA" ] || [ "$checked_out_sha" != "$TESTED_SHA" ]; then
            echo "Production target does not match the revision that passed CI."
            exit 1
          fi
          echo "Production-eligible revision: $TESTED_SHA"

      # AF-11 owns the deployment environment and credentials. Its deployment
      # job must be added here, depend on this eligibility job, and deploy
      # github.event.workflow_run.head_sha (or an artifact built from it).

  deploy:
    name: Production / Validation Deploy
    needs: eligibility
    if: vars.AF11_ENABLE_HOSTED_ENVIRONMENTS == 'true'
    runs-on: [self-hosted, linux, x64, signal-audit-production]
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      AF11_ENABLE_HOSTED_ENVIRONMENTS: ${{ vars.AF11_ENABLE_HOSTED_ENVIRONMENTS }}
      PRODUCTION_VALIDATION_ONLY: "true"
      ADMIN_AUDIT_REFERENCE: ${{ vars.ADMIN_AUDIT_REFERENCE }}
      ADMIN_ROLE_ALLOWLIST: ${{ vars.ADMIN_ROLE_ALLOWLIST }}
      COST_CONTROL_OWNER: ${{ vars.COST_CONTROL_OWNER }}
      COST_CONTROL_REFERENCE: ${{ vars.COST_CONTROL_REFERENCE }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
      STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out the exact green main revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify and deploy empty production-shaped validation environment
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          node scripts/environment/cli.mjs production up --sha "$TESTED_SHA"
