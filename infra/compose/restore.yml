# AF-69 recovery drill only. Run under a unique af69-restore-* Compose project.
# No existing runtime service, network, volume, or host port is referenced.
services:
  restore-postgres:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: af69_restore
      POSTGRES_USER: af69_restore
      POSTGRES_PASSWORD: ${RESTORE_POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U af69_restore -d af69_restore"]
      interval: 2s
      retries: 30
    volumes:
      - restore-postgres-data:/var/lib/postgresql/data
    networks: [restore-private]
    security_opt: ["no-new-privileges:true"]

  restore-storage:
    build:
      context: ../..
      dockerfile: infra/docker/minio.Dockerfile
      target: server
    command: server /data
    environment:
      MINIO_ROOT_USER: ${RESTORE_STORAGE_ACCESS_KEY_ID:?required}
      MINIO_ROOT_PASSWORD: ${RESTORE_STORAGE_SECRET_ACCESS_KEY:?required}
    volumes:
      - restore-storage-data:/data
    networks: [restore-private]
    security_opt: ["no-new-privileges:true"]

  restore:
    build:
      context: ../..
      dockerfile: infra/docker/backup.Dockerfile
    entrypoint: ["/usr/local/bin/signal-audit-restore"]
    depends_on:
      restore-postgres:
        condition: service_healthy
      restore-storage:
        condition: service_started
    environment:
      RESTORE_SOURCE_ENV: ${RESTORE_SOURCE_ENV:?required}
      BACKUP_ENDPOINT: ${BACKUP_ENDPOINT:?required}
      BACKUP_REGION: ${BACKUP_REGION:?required}
      BACKUP_BUCKET: ${BACKUP_BUCKET:?required}
      BACKUP_PATH_STYLE: ${BACKUP_PATH_STYLE:-auto}
      RESTORE_ACCESS_KEY_ID: ${RESTORE_ACCESS_KEY_ID:?required}
      RESTORE_SECRET_ACCESS_KEY: ${RESTORE_SECRET_ACCESS_KEY:?required}
      RESTORE_POSTGRES_PASSWORD: ${RESTORE_POSTGRES_PASSWORD:?required}
      RESTORE_STORAGE_ACCESS_KEY_ID: ${RESTORE_STORAGE_ACCESS_KEY_ID:?required}
      RESTORE_STORAGE_SECRET_ACCESS_KEY: ${RESTORE_STORAGE_SECRET_ACCESS_KEY:?required}
      RESTORE_DATABASE_SCHEMA: ${RESTORE_DATABASE_SCHEMA:?required}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1770,uid=70,gid=70
    volumes:
      - restore-work:/work
    networks: [restore-private, restore-egress]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

networks:
  restore-private:
    internal: true
  restore-egress: {}

volumes:
  restore-postgres-data: {}
  restore-storage-data: {}
  restore-work: {}
