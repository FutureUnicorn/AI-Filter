x-runtime-environment: &runtime-environment
  APP_ENV: ${APP_ENV:?APP_ENV is required}
  DEPLOYMENT_COMMIT_SHA: ${DEPLOYMENT_COMMIT_SHA:?DEPLOYMENT_COMMIT_SHA is required}
  # Built (and percent-encoded) by scripts/environment/model.mjs#buildDatabaseUrl
  # -- see AF-94: interpolating POSTGRES_USER/POSTGRES_PASSWORD into this URI
  # directly let an unencoded `/`, `?`, `#`, or `@` in a generated password
  # corrupt or silently reparse it.
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  DATABASE_SCHEMA: ${DATABASE_SCHEMA:?DATABASE_SCHEMA is required}
  STORAGE_ENDPOINT: http://storage:9000
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
  STORAGE_FORCE_PATH_STYLE: "true"
  WEB_PORT: "3000"
  WORKER_PORT: "3001"
  PREVIEW_ID: ${PREVIEW_ID:-}
  PREVIEW_COMMIT_SHA: ${PREVIEW_COMMIT_SHA:-}
  PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-}
  MAGIC_LINK_EMAIL_ENDPOINT: ${MAGIC_LINK_EMAIL_ENDPOINT:-}
  MAGIC_LINK_EMAIL_API_KEY: ${MAGIC_LINK_EMAIL_API_KEY:-}
  MAGIC_LINK_EMAIL_FROM: ${MAGIC_LINK_EMAIL_FROM:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
  WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}

services:
  postgres:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    cpus: ${POSTGRES_CPU_LIMIT:-0.50}
    security_opt: ["no-new-privileges:true"]

  storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
    volumes:
      - storage-data:/data
    networks: [private]
    mem_limit: ${STORAGE_MEMORY_LIMIT:-384m}
    cpus: ${STORAGE_CPU_LIMIT:-0.50}
    security_opt: ["no-new-privileges:true"]

  storage-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      storage:
        condition: service_started
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://storage:9000 "$$STORAGE_ACCESS_KEY_ID" "$$STORAGE_SECRET_ACCESS_KEY"; do sleep 2; done
        mc mb --ignore-existing "local/$$STORAGE_BUCKET"
        mc anonymous set none "local/$$STORAGE_BUCKET"
    networks: [private]
    security_opt: ["no-new-privileges:true"]

  migrate:
    image: postgres:17.10-alpine3.23
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:?DATABASE_SCHEMA is required}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$$DATABASE_SCHEMA" in (*[!a-z0-9_]*|'') echo 'Unsafe DATABASE_SCHEMA' >&2; exit 2;; esac
        psql -v ON_ERROR_STOP=1 --command "CREATE SCHEMA IF NOT EXISTS \"$$DATABASE_SCHEMA\""
        for migration in /migrations/*.sql; do
          PGOPTIONS="-c search_path=$$DATABASE_SCHEMA" psql -v ON_ERROR_STOP=1 --file "$$migration"
        done
    volumes:
      - ../../packages/db/migrations:/migrations:ro
    networks: [private]
    security_opt: ["no-new-privileges:true"]

  seed:
    image: postgres:17.10-alpine3.23
    restart: "no"
    profiles: [tools]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:?DATABASE_SCHEMA is required}
      APP_ENV: ${APP_ENV:?APP_ENV is required}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        test "$$APP_ENV" != production
        case "$$DATABASE_SCHEMA" in (*[!a-z0-9_]*|'') echo 'Unsafe DATABASE_SCHEMA' >&2; exit 2;; esac
        PGOPTIONS="-c search_path=$$DATABASE_SCHEMA" psql -v ON_ERROR_STOP=1 --file /fixtures/synthetic.sql
    volumes:
      - ../../tests/fixtures/environment:/fixtures:ro
    networks: [private]
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: ../..
      dockerfile: infra/docker/runtime.Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    environment:
      <<: *runtime-environment
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SENTRY_DSN: ${SENTRY_WEB_DSN:-}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/environment').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [public, private]
    mem_limit: ${WEB_MEMORY_LIMIT:-512m}
    cpus: ${WEB_CPU_LIMIT:-0.75}
    security_opt: ["no-new-privileges:true"]

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/runtime.Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    environment:
      <<: *runtime-environment
      SENTRY_DSN: ${SENTRY_WORKER_DSN:-}
      WORKER_PROCESSING_ENABLED: ${WORKER_PROCESSING_ENABLED:-false}
      WORKER_INSTANCE_ID: ${WORKER_INSTANCE_ID:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-10000}
      WORKER_LEASE_DURATION_MS: ${WORKER_LEASE_DURATION_MS:-60000}
      WORKER_RETRY_BASE_DELAY_MS: ${WORKER_RETRY_BASE_DELAY_MS:-5000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_ESCALATION_MODEL: ${OPENAI_ESCALATION_MODEL:-}
      INFERENCE_MAX_TOKENS_PER_PERIOD: ${INFERENCE_MAX_TOKENS_PER_PERIOD:-}
      INFERENCE_ALERT_THRESHOLD_RATIO: ${INFERENCE_ALERT_THRESHOLD_RATIO:-}
      INFERENCE_BUDGET_PERIOD: ${INFERENCE_BUDGET_PERIOD:-}
      INFERENCE_ESTIMATED_OUTPUT_TOKENS: ${INFERENCE_ESTIMATED_OUTPUT_TOKENS:-2000}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/environment').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    # No host port is published, but provider execution requires outbound access.
    networks: [public, private]
    mem_limit: ${WORKER_MEMORY_LIMIT:-384m}
    cpus: ${WORKER_CPU_LIMIT:-0.50}
    security_opt: ["no-new-privileges:true"]

networks:
  public: {}
  private:
    internal: true

volumes:
  postgres-data: {}
  storage-data: {}
