x-runtime-environment: &runtime-environment
  APP_ENV: ${APP_ENV:?APP_ENV is required}
  DEPLOYMENT_COMMIT_SHA: ${DEPLOYMENT_COMMIT_SHA:?DEPLOYMENT_COMMIT_SHA is required}
  DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
  DATABASE_SCHEMA: ${DATABASE_SCHEMA:?DATABASE_SCHEMA is required}
  STORAGE_ENDPOINT: http://storage:9000
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
  STORAGE_FORCE_PATH_STYLE: "true"
  WEB_PORT: "3000"
  WORKER_PORT: "3001"
  PREVIEW_ID: ${PREVIEW_ID:-}
  PREVIEW_COMMIT_SHA: ${PREVIEW_COMMIT_SHA:-}
  PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-}
  MAGIC_LINK_EMAIL_ENDPOINT: ${MAGIC_LINK_EMAIL_ENDPOINT:-}
  MAGIC_LINK_EMAIL_API_KEY: ${MAGIC_LINK_EMAIL_API_KEY:-}
  MAGIC_LINK_EMAIL_FROM: ${MAGIC_LINK_EMAIL_FROM:-}

services:
  postgres:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    cpus: ${POSTGRES_CPU_LIMIT:-0.50}
    security_opt: ["no-new-privileges:true"]

  storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
    volumes:
      - storage-data:/data
    networks: [private]
    mem_limit: ${STORAGE_MEMORY_LIMIT:-384m}
    cpus: ${STORAGE_CPU_LIMIT:-0.50}
    security_opt: ["no-new-privileges:true"]

  storage-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      storage:
        condition: service_started
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://storage:9000 "$$STORAGE_ACCESS_KEY_ID" "$$STORAGE_SECRET_ACCESS_KEY"; do sleep 2; done
        mc mb --ignore-existing "local/$$STORAGE_BUCKET"
        mc anonymous set none "local/$$STORAGE_BUCKET"
    networks: [private]
    security_opt: ["no-new-privileges:true"]

  migrate:
    image: postgres:17.10-alpine3.23
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:?DATABASE_SCHEMA is required}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$$DATABASE_SCHEMA" in (*[!a-z0-9_]*|'') echo 'Unsafe DATABASE_SCHEMA' >&2; exit 2;; esac
        psql -v ON_ERROR_STOP=1 --command "CREATE SCHEMA IF NOT EXISTS \"$$DATABASE_SCHEMA\""
        for migration in /migrations/*.sql; do
          PGOPTIONS="-c search_path=$$DATABASE_SCHEMA" psql -v ON_ERROR_STOP=1 --file "$$migration"
        done
    volumes:
      - ../../packages/db/migrations:/migrations:ro
    networks: [private]
    security_opt: ["no-new-privileges:true"]

  seed:
    image: postgres:17.10-alpine3.23
    restart: "no"
    profiles: [tools]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:?DATABASE_SCHEMA is required}
      APP_ENV: ${APP_ENV:?APP_ENV is required}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        test "$$APP_ENV" != production
        case "$$DATABASE_SCHEMA" in (*[!a-z0-9_]*|'') echo 'Unsafe DATABASE_SCHEMA' >&2; exit 2;; esac
        PGOPTIONS="-c search_path=$$DATABASE_SCHEMA" psql -v ON_ERROR_STOP=1 --file /fixtures/synthetic.sql
    volumes:
      - ../../tests/fixtures/environment:/fixtures:ro
    networks: [private]
    security_opt: ["no-new-privileges:true"]

  # AF-97: the only way to create a deployment's first organization, user and
  # owner membership. Authentication here is invite-only and the first invite
  # has nobody to come from, so this step cannot live behind a session -- and
  # it is deliberately not an HTTP route, because an unauthenticated
  # privilege-granting endpoint that must be disabled after first use is not a
  # security control.
  #
  # It is a compose service rather than something an operator runs from their
  # laptop because `postgres` sits only on the `private` network, which is
  # `internal: true` and publishes no port (review #88, REV-001). There is no
  # path to that database from outside the project, so the command has to run
  # inside it. That keeps the authorization exactly where the design says it
  # is: on the deployment's own database credentials, with nothing new
  # exposed.
  #
  #   docker compose --profile tools run --rm bootstrap \
  #     --organization "Acme" --email owner@acme.test --name "Dana Ops"
  #
  # Unlike `seed`, this is NOT refused in production: a production deployment
  # is precisely where somebody has to be the first owner. It writes only the
  # three rows it names, and re-running it converges rather than duplicating.
  bootstrap:
    build:
      context: ../..
      dockerfile: infra/docker/runtime.Dockerfile
      target: runtime-base
    restart: "no"
    profiles: [tools]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *runtime-environment
    # The pnpm script adds `--env-file-if-exists=.env.local`, which is a
    # developer convenience and not present here; the environment above is
    # the deployment's own. Arguments from `docker compose run` are appended
    # to this entrypoint.
    entrypoint: ["node", "scripts/environment/bootstrap.mjs"]
    networks: [private]
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: ../..
      dockerfile: infra/docker/runtime.Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    environment:
      <<: *runtime-environment
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/environment').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [public, private]
    mem_limit: ${WEB_MEMORY_LIMIT:-512m}
    cpus: ${WEB_CPU_LIMIT:-0.75}
    security_opt: ["no-new-privileges:true"]

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/runtime.Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    environment:
      <<: *runtime-environment
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/environment').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]
    mem_limit: ${WORKER_MEMORY_LIMIT:-384m}
    cpus: ${WORKER_CPU_LIMIT:-0.50}
    security_opt: ["no-new-privileges:true"]

networks:
  public: {}
  private:
    internal: true

volumes:
  postgres-data: {}
  storage-data: {}
